name: Utils

on:
  push:
    paths:
      - "utils/**"
      - "auth/middleware/**"
      - "examples/utils/**"
      - "examples/web/**"
      - ".github/workflows/utils.yml"
  pull_request:
    paths:
      - "utils/**"
      - "auth/middleware/**"
      - "examples/utils/**"
      - "examples/web/**"
      - ".github/workflows/utils.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -run '^$' ./...
      - run: go test -race ./utils/...
      - run: go vet ./...
      - run: go test ./utils/crypt -run '^$' -fuzz '^FuzzParsePasswordHash$' -fuzztime 10s
