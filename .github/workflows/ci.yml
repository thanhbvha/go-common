name: quality
on:
  push:
    branches: [main, 'v2-production']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: bash .github/scripts/check-boundaries.sh
      - run: go mod verify
      - run: go build ./...
      - run: go test -race -count=1 -timeout=180s ./...
      - run: go vet ./...
      - name: Vulnerability scan
        run: |
          mkdir -p artifacts
          bash .github/scripts/security-gate.sh "artifacts/govulncheck-${{ matrix.go }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck-${{ matrix.go }}
          path: artifacts/govulncheck-${{ matrix.go }}.json
      - name: Verify tidy manifests
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash .github/scripts/test-fuzz.sh
  brokers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Broker contract matrix
        run: |
          mkdir -p artifacts
          bash .github/scripts/test-brokers.sh | tee artifacts/broker-matrix.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broker-matrix
          path: artifacts/broker-matrix.txt
  faults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash .github/scripts/test-faults.sh
