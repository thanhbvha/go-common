name: production-soak
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Reference production soak
        run: |
          mkdir -p artifacts
          bash .github/scripts/test-production.sh | tee artifacts/production-soak.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-soak
          path: artifacts/production-soak.txt
