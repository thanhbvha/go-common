name: cron
on:
  pull_request:
    paths: ['cron/**', 'cache/**', 'examples/cron/**', 'go.mod', 'go.sum', '.github/workflows/cron.yml']
  push:
    branches: [main, 'v2-production']
    paths: ['cron/**', 'cache/**', 'examples/cron/**', 'go.mod', 'go.sum', '.github/workflows/cron.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=10 ./cron
      - run: go test -race -count=10 ./cache -run '^TestRedisLockSession'
      - run: go test ./examples/cron
      - run: go vet ./cron ./cache ./examples/cron
