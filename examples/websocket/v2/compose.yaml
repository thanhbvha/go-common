# Local development only. Neither broker is exposed beyond loopback.
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 1s
      retries: 15
  nats:
    image: nats:2.11-alpine
    profiles: [nats]
    ports: ["127.0.0.1:14222:4222"]
