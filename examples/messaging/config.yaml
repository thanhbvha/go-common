# Local disposable services only. Adjust endpoints/credentials once, then run:
#   go run ./examples/messaging
# CLI -driver / -broker override selections. Existing fixture env vars override
# connection fields; see README.md. NATS is an owned embedded JetStream server.
driver: postgres # postgres | mysql | mongodb | all
broker: nats     # redis | nats | kafka | all

postgres:
  dsn: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=messaging_test sslmode=disable"

mysql:
  # Oracle MySQL 8.4/InnoDB; the configured database must already exist.
  dsn: "root@tcp(127.0.0.1:3306)/messaging_test"

mongodb:
  # Requires a replica set, not a standalone server. Match your replicaSet name.
  uri: "mongodb://127.0.0.1:37017/?replicaSet=rs0&directConnection=true"

redis:
  addr: "127.0.0.1:16379"
  username: ""
  password: ""
  db: 0

kafka:
  brokers:
    - "127.0.0.1:9092"
